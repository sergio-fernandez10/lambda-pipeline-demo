AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: Lambda Pipeline Demo with API Gateway and DynamoDB

Resources:
  ItemsTable:
    Type: AWS::Dynamo::Table
    Properties:
      TableName: items-table
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  HelloFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handler.lambda_handler
      Runtime: python3.12
      MemorySize: 128
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME: !Ref ItemsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ItemsTable
      Events:
        HelloRoute:
          Type: HttpApi
          Properties:
            Path: /hello
            Method: GET
        GetItemsRoute:
          Type: HttpApi
          Properties:
            Path: /items
            Method: GET
        GetItemsByIdRoute:
          Type: HttpApi
          Properties:
            Path: /items/{id}
            Method: GET
        PostItemsRoute:
          Type: HttpApi
          Properties:
            Path: /items
            Method: POST

Outputs:
  ApiUrl:
    Description: API Gateway URL
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
